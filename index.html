<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Playground Duty Schedule</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    h1 { text-align: center; }
    .row { padding: 6px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

<h1>Playground Duty Schedule</h1>
<div id="schedule"></div>

<script>
const people = ["Jernej", "Jošt", "Jan", "Dori", "Jani"];

// IMPORTANT: first Saturday of known assignment
const startDate = new Date("2026-06-27");

function getSaturday(d) {
  let date = new Date(d);
  let day = date.getDay(); // 0 Sunday ... 6 Saturday
  let diff = (6 - day);
  date.setDate(date.getDate() + diff);
  return date;
}

function formatDate(d) {
  return d.toISOString().split("T")[0];
}

let container = document.getElementById("schedule");

let today = new Date();
let saturday = getSaturday(today);

for (let i = 0; i < 26; i++) { // ~6 months
  let d = new Date(saturday);
  d.setDate(d.getDate() + i * 7);

  let weeksSinceStart = Math.floor((d - startDate) / (7 * 24 * 60 * 60 * 1000));
  let person = people[((weeksSinceStart % people.length) + people.length) % people.length];

  let div = document.createElement("div");
  div.className = "row";
  div.textContent = `${formatDate(d)} — ${person}`;
  container.appendChild(div);
}
</script>

</body>
</html>
